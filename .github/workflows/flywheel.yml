name: Discovery flywheel

# Sweeps monitored channels daily, extracts who they platform, diffs against the
# tracked database, and commits a candidate review queue (flywheel/candidates.*).
# Runs without a session open. Stdlib only — no secrets needed.

on:
  schedule:
    - cron: '0 13 * * *'   # daily ~13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sweep channels + build candidate queue
        run: python3 tools/flywheel.py
      - name: Monitor a rotating batch of tracked entities (web mentions)
        env:
          MONITOR_BATCH: '250'
        run: python3 tools/monitor.py
      - name: Commit the queues if they changed
        run: |
          git config user.name "bft-flywheel[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flywheel/candidates.json flywheel/candidates.md flywheel/mentions.json flywheel/monitor_state.json
          git diff --staged --quiet || git commit -m "flywheel: refresh candidate + entity-mention queues [skip ci]"
          git push
